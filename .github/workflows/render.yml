name: Render reel
run-name: "Render ${{ inputs.reel }}"

on:
  workflow_dispatch:
    inputs:
      reel:
        description: Which reel to render
        type: choice
        default: BackInReel
        options: [BackInReel, BackInReel2, BackInReel3, BackInReel4, BenReel, ProA, ProB, ProC]
      drive_footage:
        description: "Use the newest video in Drive: BackIn Content > 03 Demo Recordings as the phone footage"
        type: boolean
        default: false
      upload:
        description: Upload to the reels bucket and make a 7-day Buffer link
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: render-${{ inputs.reel }}
  cancel-in-progress: false

jobs:
  render:
    # Public repo: run logs are world-readable, so nothing private is printed here.
    if: github.ref == 'refs/heads/main' && github.repository == 'northtempostudio/backin-reels'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Get render assets (private repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: northtempostudio/backin-reels-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets
          persist-credentials: false
      - run: mv assets/public video/public

      - name: Sign in to Google (no key file)
        if: inputs.drive_footage
        id: google
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/1031455712284/locations/global/workloadIdentityPools/github/providers/backin-reels
          service_account: backin-reels-drive@pulse-habittracker.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Pull footage from Drive
        if: inputs.drive_footage
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          api=https://www.googleapis.com/drive/v3/files
          q=$(jq -rn '"name contains \"03 Demo Recordings\" and mimeType = \"application/vnd.google-apps.folder\" and trashed = false" | @uri')
          folder=$(curl -sf -H "Authorization: Bearer $TOKEN" "$api?q=$q&fields=files(id)" | jq -r '.files[0].id // empty')
          [ -n "$folder" ] || { echo "::error::Drive folder not found"; exit 1; }
          q=$(jq -rn --arg f "$folder" '"\"" + $f + "\" in parents and mimeType contains \"video/\" and trashed = false" | @uri')
          id=$(curl -sf -H "Authorization: Bearer $TOKEN" "$api?q=$q&orderBy=createdTime%20desc&pageSize=1&fields=files(id)" | jq -r '.files[0].id // empty')
          [ -n "$id" ] || { echo "::error::No video in that Drive folder"; exit 1; }
          curl -sfL -H "Authorization: Bearer $TOKEN" "$api/$id?alt=media" -o video/public/footage.mp4
          echo "Drive footage downloaded ($(stat -c %s video/public/footage.mp4) bytes)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install
        working-directory: video
        run: npm ci

      - name: Render
        working-directory: video
        run: npx remotion render src/index.ts "${{ inputs.reel }}" "out/${{ inputs.reel }}.mp4" --codec h264 --crf 18

      - name: Upload through the R2 free-tier guard
        if: inputs.upload
        env:
          CF_REELS_USAGE: ${{ secrets.CF_REELS_USAGE }}
          CF_REELS_S3_ID: ${{ secrets.CF_REELS_S3_ID }}
          CF_REELS_S3_SECRET: ${{ secrets.CF_REELS_S3_SECRET }}
          REELS_LINK_SECRET: ${{ secrets.REELS_LINK_SECRET }}
        run: |
          node guard/upload.mjs "video/out/${{ inputs.reel }}.mp4" --source GitHub
          echo "Done. Open your private BackIn Reels dashboard to watch, download or copy the prompt." >> "$GITHUB_STEP_SUMMARY"
