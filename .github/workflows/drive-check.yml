name: Drive check
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1031455712284/locations/global/workloadIdentityPools/github/providers/backin-reels
          service_account: backin-reels-drive@pulse-habittracker.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
        id: auth
      - name: List Drive files the robot can see
        run: |
          curl -sf -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://www.googleapis.com/drive/v3/files?pageSize=20&fields=files(id,name,mimeType)" | tee files.json
